<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FT-857D Station Console</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e9ecef; color: #333; padding: 20px; text-align: center; }

        /* 🎛️ Band Row Bar Container (Top) */
        .top-band-row { display: flex; gap: 4px; justify-content: center; margin-bottom: 10px; max-width: 900px; margin: 0 auto 10px auto; flex-wrap: wrap; }
        .band-pill { background: #ced4da; border: 1px solid #adb5bd; border-radius: 4px; padding: 4px 8px; font-size: 13px; font-weight: bold; color: #495057; cursor: pointer; }
        .band-pill:hover { background: #6c757d; color: white; }

        /* 🟨 The Main Bezel Rig Body Frame */
        .rig-body { background: #ffcc00; max-width: 820px; margin: 0 auto; border-radius: 8px; border: 3px solid #cca300; padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }

        /* 📟 Horizontal Mode Bar Row */
        .mode-row { display: flex; gap: 6px; justify-content: center; background: #ffffff; padding: 8px; border-radius: 6px; margin-bottom: 15px; }
        .mode-btn { background: #e9ecef; border: 1px solid #ced4da; border-radius: 4px; padding: 4px 12px; font-weight: bold; color: #495057; cursor: pointer; }
        .mode-btn.active { background: #6c757d; color: white; }

        /* 📊 Classic Horizontal Line Combined Meter Panel */
        .meter-panel { background: #ffffff; border-radius: 6px; padding: 8px 15px; text-align: left; font-family: monospace; font-size: 11px; font-weight: bold; margin-bottom: 15px; position: relative; }
        .meter-line-row { display: flex; gap: 30px; margin-bottom: 4px; }
        .meter-track { background: #e9ecef; width: 100%; height: 6px; border-radius: 2px; position: relative; margin-top: 2px; overflow: hidden; }
        .meter-fill { background: #007bff; height: 100%; width: 15%; transition: width 0.15s ease; }

        /* 🎚️ RF Power Slider Controls Wrapper */
        .slider-panel { background: #ffffff; padding: 8px 15px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-weight: bold; font-size: 13px; }
        .pwr-slider { -webkit-appearance: none; width: 70%; height: 6px; border-radius: 3px; background: #e9ecef; outline: none; }
        .pwr-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 4px; background: #ffcc00; border: 2px solid #cca300; cursor: pointer; }

        /* 🟢 Active VFO-A Control Window Block */
        .vfo-main-box { background: #ffffff; border: 2px solid #333; border-radius: 6px; padding: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .vfo-badge { background: #e9ecef; border: 1px solid #333; padding: 4px 8px; font-weight: bold; font-size: 14px; border-radius: 3px; }
        .vfo-digits { font-size: 42px; font-family: monospace; font-weight: bold; letter-spacing: 2px; color: #212529; flex-grow: 1; text-align: center; }
        .vfo-dial-wheel { background: #495057; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #212529; cursor: pointer; margin-right: 15px; }

        /* 🔴 Red PTT Button Trigger Box */
        .ptt-btn { background: #dc3545; border: 2px solid #bd2130; border-radius: 4px; color: white; padding: 10px 15px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .ptt-btn.active { background: #28a745; border-color: #1e7e34; }

        /* 🔘 Tuning Control Action Row Toggles */
        .tune-btn-group { display: flex; gap: 8px; }
        .tune-btn { background: #ced4da; border: 1px solid #6c757d; border-radius: 4px; padding: 8px 18px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .tune-btn:hover { background: #adb5bd; }

        /* ⚪ Isolated VFO-B Storage Panel Container */
        .vfo-sub-box { background: #ffffff; border: 1px solid #6c757d; border-radius: 6px; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .vfo-sub-digits { font-size: 24px; font-family: monospace; font-weight: bold; color: #495057; letter-spacing: 1px; }

        /* 🏷️ Status Badges Row Bar */
        .status-badge-row { display: flex; gap: 8px; margin-bottom: 15px; font-family: monospace; font-size: 11px; font-weight: bold; }
        .status-badge { background: #ffffff; border: 1px solid #333; border-radius: 4px; padding: 2px 6px; }
        .status-badge.highlight { background: #000000; color: #ffffff; }

        /* 🎚️ Filter Tabs Grid Box Strip */
        .filter-row { display: flex; gap: 6px; background: #ffffff; padding: 6px; border-radius: 6px; margin-bottom: 15px; justify-content: space-between; flex-wrap: wrap; }
        .filter-lbl { font-size: 10px; color: #6c757d; font-weight: bold; width: 100%; text-align: left; margin-left: 5px; text-transform: uppercase; }
        .filter-btn { background: #ced4da; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: bold; color: #495057; cursor: pointer; flex-grow: 1; }
        .filter-btn.active { background: #6c757d; color: white; }

        /* ⚡ Base Split/Function Buttons Row (Bottom) */
        .bottom-action-row { display: flex; gap: 8px; justify-content: center; }
        .action-btn { background: #ced4da; border: 1px solid #adb5bd; border-radius: 4px; padding: 5px 15px; font-size: 13px; font-weight: bold; color: #495057; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 🎛️ Dynamic Target Frequency Bands (Top Row Grid) -->
    <div class="top-band-row">
        <div class="band-pill" onclick="selectBand('160m', 1800000)">160m</div>
        <div class="band-pill" onclick="selectBand('80m', 3573000)">80m</div>
        <div class="band-pill" onclick="selectBand('60m', 5357000)">60m</div>
        <div class="band-pill" onclick="selectBand('40m', 7074000)">40m</div>
        <div class="band-pill" onclick="selectBand('30m', 10136000)">30m</div>
        <div class="band-pill" onclick="selectBand('20m', 14074000)">20m</div>
        <div class="band-pill" onclick="selectBand('17m', 18104000)">17m</div>
        <div class="band-pill" onclick="selectBand('15m', 21074000)">15m</div>
        <div class="band-pill" onclick="selectBand('12m', 24915000)">12m</div>
        <div class="band-pill" onclick="selectBand('10m', 28074000)">10m</div>
        <div class="band-pill" onclick="selectBand('6m', 50313000)">6m</div>
        <div class="band-pill">AIR</div>
        <div class="band-pill" onclick="selectBand('2m', 144200000)">2m</div>
        <div class="band-pill" onclick="selectBand('70cm', 432200000)">70cm</div>
    </div>

    <!-- 🟨 The Main Yellow Bezel Rig Body Frame -->
    <div class="rig-body">

        <!-- 📟 Mode Selection Header Strip (With AM & DIGI Options) -->
        <div class="mode-row">
            <button class="mode-btn active" id="mode-LSB" onclick="setMode('LSB')">LSB</button>
            <button class="mode-btn" id="mode-USB" onclick="setMode('USB')">USB</button>
            <button class="mode-btn" id="mode-AM" onclick="setMode('AM')">AM</button>
            <button class="mode-btn" id="mode-CW" onclick="setMode('CW')">CW</button>
            <button class="mode-btn" id="mode-CWR" onclick="setMode('CW-R')">CW-R</button>
            <button class="mode-btn" id="mode-FM" onclick="setMode('FM')">FM</button>
            <button class="mode-btn" id="mode-C4FM" onclick="setMode('C4FM')">C4FM</button>
            <button class="mode-btn" id="mode-DIGI" onclick="setMode('DIGI')">DIGI</button>
        </div>

        <!-- 📊 Real-Time Multi-Function Metrics Panel Layout -->
        <div class="meter-panel">
            <div class="meter-line-row">
                <div style="width:70px;">SIG 1 3 5 7 9 20 40 60</div>
                <div class="meter-track"><div id="smeter-fill" class="meter-fill" style="background:#007bff;"></div></div>
            </div>
            <div class="meter-line-row">
                <div style="width:70px;">PWR 0 25 50 75 100</div>
                <div class="meter-track"><div id="power-fill" class="meter-fill" style="background:#dc3545; width:0%;"></div></div>
            </div>
            <div class="meter-line-row">
                <div style="width:70px;">ALC 1 2 3 ∞</div>
                <div class="meter-track"><div id="alc-fill" class="meter-fill" style="background:#ffc107; width:0%;"></div></div>
            </div>
        </div>

        <!-- 🎚️ RF Power Level Slider Control Component -->
        <div class="slider-panel">
            <span>RF POWER OUTPUT LIMIT</span>
            <input type="range" id="pwrSlider" class="pwr-slider" min="5" max="100" value="50" oninput="changePwrLimit(this.value)">
            <span id="pwr-display">50 Watts</span>
        </div>

        <!-- 🟢 Primary Active VFO-A Control Window Block (With PTT Integration) -->
        <div class="vfo-main-box">
            <button class="ptt-btn" id="ptt-trigger" onclick="togglePTTLock()">PTT</button>
            <div class="vfo-badge">A</div>
            <div class="vfo-digits" id="vfo-a-display">03.573.00</div>
            <div class="vfo-dial-wheel" onclick="tuneStep(100)" title="Click to spin dial knob"></div>
            <div class="tune-btn-group">
                <button class="tune-btn" onwheel="handleWheelTuning(event)" onclick="tuneStep(-1000)">Down</button>
                <button class="tune-btn" onwheel="handleWheelTuning(event)" onclick="tuneStep(1000)">UP</button>
            </div>
        </div>

        <!-- ⚪ Sub VFO-B Storage Register Row -->
        <div class="vfo-sub-box">
            <div style="display:flex; gap:15px; align-items:center;">
                <div class="vfo-badge" style="padding:2px 6px; font-size:12px;">B</div>
                <div class="vfo-sub-digits" id="vfo-b-display">145.500.00</div>
